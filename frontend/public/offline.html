<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FarmSe - You are currently offline</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background-color: #064e3b;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      background: rgba(255, 255, 255, 0.08);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      padding: 40px 24px;
      max-width: 440px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
    }
    .icon {
      width: 72px;
      height: 72px;
      background: rgba(16, 185, 129, 0.2);
      border: 2px solid #10b981;
      border-radius: 20px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 24px;
      font-size: 32px;
    }
    h1 {
      font-size: 22px;
      font-weight: 800;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    p {
      font-size: 13px;
      color: #a7f3d0;
      line-height: 1.6;
      margin-bottom: 28px;
    }
    .btn {
      display: block;
      width: 100%;
      background: #10b981;
      color: #064e3b;
      font-size: 14px;
      font-weight: 700;
      padding: 14px 20px;
      border-radius: 9999px;
      text-decoration: none;
      border: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    .btn:hover {
      background: #34d399;
    }
    .btn:active {
      transform: scale(0.98);
    }
    .status-badge {
      display: inline-block;
      margin-top: 20px;
      font-size: 11px;
      color: #6ee7b7;
      background: rgba(0, 0, 0, 0.2);
      padding: 6px 14px;
      border-radius: 9999px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🌾</div>
    <h1>You are Currently Offline</h1>
    <p>
      It looks like your internet connection is lost. Don't worry, FarmSe will reconnect you as soon as you're back online.
    </p>
    <button class="btn" onclick="window.location.reload()">
      🔄 Retry Connection
    </button>
    <div class="status-badge">
      ⚡ FarmSe Progressive Web App Offline Mode
    </div>
  </div>
</body>
</html>
